name: Release

on:
  release:
    types: [created]

env:
  TAG: ${{ github.event.release.tag_name }}
  DEPLOYMENT_NAME: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      tag: ${{ github.event.release.tag_name }}-rc

  release-docker:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
      with:
        client-id: ${{ secrets.MANAGED_ID_CLIENT_ID }}
        tenant-id: ${{ secrets.MANAGED_ID_TENANT_ID }}
        subscription-id: ${{ vars.SUBSCRIPTION }}

    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - run: |
        image="${{ github.repository }}:${{ github.event.release.tag_name }}"
        docker pull ${{ vars.REGISTRY }}/$image-rc
        docker tag ${{ vars.REGISTRY }}/$image-rc ghcr.io/$image
        docker push ghcr.io/$image
