name: Release

on:
  release:
    types: [created]

env:
  TAG: ${{ github.event.release.tag_name }}
  DEPLOYMENT_NAME: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      tag: ${{ github.event.release.tag_name }}-rc

  release-docker:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ secrets.MANAGED_ID_CLIENT_ID }}
        tenant-id: ${{ secrets.MANAGED_ID_TENANT_ID }}
        subscription-id: ${{ vars.SUBSCRIPTION }}

    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - run: |
        image="${{ github.repository }}:${{ github.event.release.tag_name }}"
        docker pull ${{ vars.REGISTRY }}/$image-rc
        docker tag ${{ vars.REGISTRY }}/$image-rc ghcr.io/$image
        docker push ghcr.io/$image
