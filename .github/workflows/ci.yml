name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, dev/* ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to use for the release'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'The tag to use for the release'
        required: true
        type: string


env:
  SUBSCRIPTION: ${{ vars.SUBSCRIPTION }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  LOCATION: ${{ vars.LOCATION }}
  REGISTRY: ${{ vars.REGISTRY }}
  MANAGED_IDENTITY: ${{ vars.MANAGED_IDENTITY }}
  DEPLOYMENT_NAME: test-${{ inputs.tag || format('ci-{0}', github.run_id) }}
  TAG: ${{ inputs.tag || format('ci-{0}', github.run_id) }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: make lint

  unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: make test-unit

  system:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: make test-system

  docker:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: make test-docker

  server:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: make test-server

  python:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: make test-python

  aci:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    needs: lint
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ secrets.MANAGED_ID_CLIENT_ID }}
        tenant-id: ${{ secrets.MANAGED_ID_TENANT_ID }}
        subscription-id: ${{ vars.SUBSCRIPTION }}
    - run: make test-aci

  coverage:
    runs-on: ubuntu-latest
    needs: [unit, system, docker, server, python]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: make coverage

  address-sanitizer:
    runs-on: ubuntu-latest
    needs: [unit, system, docker, server, python]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: make asan
